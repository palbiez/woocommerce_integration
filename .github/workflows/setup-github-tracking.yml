name: Setup GitHub Tracking

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/setup-github-tracking.yml"
      - "scripts/setup-github-tracking.ps1"

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create labels, milestones and issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/setup-github-tracking.ps1

