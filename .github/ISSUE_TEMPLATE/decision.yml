name: Decision
description: Offene Architektur- oder Fachentscheidung dokumentieren
title: "[M?-???] [DECISION] "
labels:
  - "type: decision"
  - "status: needs-decision"
body:
  - type: input
    id: order
    attributes:
      label: Reihenfolge
      description: Reihenfolge innerhalb des Milestones, z. B. M2-040.
      placeholder: M2-040
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Entscheidung
      description: Welche Frage muss entschieden werden?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Optionen
      placeholder: |
        1. Option A
        2. Option B
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Auswirkung
      description: Welche Folgen hat die Entscheidung fuer Umsetzung, Betrieb oder Kosten?
    validations:
      required: true
