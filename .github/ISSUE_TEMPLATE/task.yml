name: Task
description: Konkrete Umsetzungsaufgabe erfassen
title: "[M?-???] [TASK] "
labels:
  - "type: task"
body:
  - type: input
    id: order
    attributes:
      label: Reihenfolge
      description: Reihenfolge innerhalb des Milestones, z. B. M1-030.
      placeholder: M1-030
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Aufgabe
      description: Was ist umzusetzen?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of Done
      placeholder: |
        - [ ] Code/Dokumentation ist umgesetzt
        - [ ] Ergebnis wurde getestet
        - [ ] Keine Secrets wurden committed
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: Referenzen
      description: Links zu APIs, Dateien oder Folge-Issues.
