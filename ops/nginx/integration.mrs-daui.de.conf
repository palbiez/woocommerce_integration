# Dedicated public Etsy/WooCommerce integration vhost.
# The symlink in /etc/nginx/conf.d is deployment-only and is not tracked.

server {
    listen 80;
    listen [::]:80;
    server_name integration.mrs-daui.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot/wci;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name integration.mrs-daui.de;

    ssl_certificate /etc/letsencrypt/live/integration.mrs-daui.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integration.mrs-daui.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Etsy OAuth callback: public GET endpoint; no Authelia auth_request.
    location = /oauth/etsy/start {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        auth_request off;
    }

    location = /oauth/etsy/callback {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        auth_request off;
    }

    # Etsy webhook receiver: public signed POST endpoint; no Authelia auth_request.
    location = /webhooks/etsy {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        auth_request off;
    }

    location / {
        return 404;
    }
}
