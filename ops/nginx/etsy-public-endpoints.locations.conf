# WooCommerce/Etsy integration public endpoints.
# Include this file inside the existing TLS server block for
# integration.mrs-daui.de. Do not put auth_request in these locations:
# Etsy must be able to call them without an Authelia session.

location = /oauth/etsy/callback {
    proxy_pass http://127.0.0.1:6001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    auth_request off;
}

location = /webhooks/etsy {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:6001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    auth_request off;
}
